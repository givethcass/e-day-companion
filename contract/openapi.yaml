openapi: 3.1.0
info:
  title: E-Day Companion API (simulada)
  version: 0.10.0
  description: |
    Contrato v0 de la API simulada para el concepto de portafolio "E-Day Companion".
    Imita lo que darían los servicios oficiales del juego (identidad Xbox, datos de
    PlayFab). Todo dato es simulado. Concepto no oficial: no afiliado a Microsoft,
    Xbox ni The Coalition.
servers:
  - url: http://localhost:8787/v0
    description: Backend simulado (apps/api-mock; en la demo web corre dentro de la app)
security:
  - bearerAuth: []
tags:
  - name: Jugador
  - name: Partidas
  - name: Servicio
  - name: Clasificaciones
  - name: Temporada
  - name: Tienda
  - name: Eventos
  - name: Escuadras
  - name: Clanes
  - name: Notificaciones
  - name: Noticias
  - name: Guías
  - name: Comunidad
  - name: Colaboraciones
paths:
  /me:
    get:
      tags: [Jugador]
      summary: Perfil del jugador autenticado
      operationId: getMe
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
  /me/week:
    get:
      tags: [Jugador]
      summary: Informe de despliegue (resumen semanal personalizado)
      operationId: getMyWeek
      parameters:
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Resumen de la semana
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyReport' }
  /me/notifications:
    get:
      tags: [Notificaciones]
      summary: Avisos del jugador (sesión cerca, objeto deseado en tienda, evento por terminar, rival)
      operationId: listMyNotifications
      description: En la demo se derivan del informe semanal, la lista de deseos y las sesiones; no hay datos sembrados propios.
      parameters:
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Avisos, el más reciente primero
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
  /me/wallet:
    get:
      tags: [Jugador]
      summary: Saldo de Monedas y Hierro, con el tope semanal de Monedas
      operationId: getMyWallet
      parameters:
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Saldo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
  /me/notification-prefs:
    get:
      tags: [Notificaciones]
      summary: Qué avisos quiere recibir el jugador
      operationId: getNotificationPrefs
      responses:
        '200':
          description: Preferencias
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPrefs' }
    put:
      tags: [Notificaciones]
      summary: Cambiar qué avisos recibe el jugador
      operationId: setNotificationPrefs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPrefs' }
      responses:
        '200':
          description: Preferencias guardadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPrefs' }
  /me/service-record:
    get:
      tags: [Servicio]
      summary: Récord de servicio del jugador hasta asOf, calculado de sus partidas
      operationId: getServiceRecord
      parameters:
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Récord de servicio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRecord' }
  /me/medals:
    get:
      tags: [Servicio]
      summary: Series de medallas con el progreso del jugador y la fecha de cada nivel obtenido
      operationId: listMyMedals
      parameters:
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Medallas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Medal' }
  /me/medals/{medalId}:
    get:
      tags: [Servicio]
      summary: Una serie de medallas
      operationId: getMyMedal
      parameters:
        - name: medalId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Medalla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Medal' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/medals/equipped:
    put:
      tags: [Servicio]
      summary: Elegir hasta 3 medallas para la tarjeta de perfil (solo series con al menos un nivel obtenido)
      operationId: setEquippedMedals
      parameters:
        - $ref: '#/components/parameters/AsOf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [medalIds]
              properties:
                medalIds:
                  type: array
                  maxItems: 3
                  items: { type: string }
      responses:
        '200':
          description: Medallas equipadas, en orden
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MedalUnlock' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /me/matches:
    get:
      tags: [Partidas]
      summary: Historial de partidas del jugador
      operationId: listMyMatches
      parameters:
        - name: mode
          in: query
          schema: { $ref: '#/components/schemas/Mode' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Página de partidas, más recientes primero
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MatchSummary' }
                  nextCursor: { type: [string, 'null'] }
  /matches/{matchId}:
    get:
      tags: [Partidas]
      summary: Reporte detallado de una partida
      operationId: getMatch
      parameters:
        - name: matchId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Reporte de partida. La lección puede apuntar a algo que viene después de la partida, visto desde asOf.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchReport' }
        '404': { $ref: '#/components/responses/NotFound' }
  /leaderboards/{mode}:
    get:
      tags: [Clasificaciones]
      summary: Clasificación por modo
      operationId: getLeaderboard
      parameters:
        - name: mode
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Mode' }
        - name: scope
          in: query
          schema:
            type: string
            enum: [global, country, friends, clan]
            default: global
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Clasificación con la posición del jugador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Leaderboard' }
  /season/current:
    get:
      tags: [Temporada]
      summary: Temporada actual
      operationId: getCurrentSeason
      responses:
        '200':
          description: Temporada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Season' }
  /me/challenges:
    get:
      tags: [Temporada]
      summary: Desafíos semanales del jugador y su progreso
      operationId: listMyChallenges
      parameters:
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Desafíos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Challenge' }
  /store/rotation:
    get:
      tags: [Tienda]
      summary: Rotación vigente de la tienda (cambia cada martes)
      operationId: getStoreRotation
      parameters:
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Rotación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreRotation' }
  /me/wishlist:
    get:
      tags: [Tienda]
      summary: Lista de deseos
      operationId: getWishlist
      responses:
        '200':
          description: Objetos deseados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StoreItem' }
    post:
      tags: [Tienda]
      summary: Agregar un objeto a la lista de deseos
      operationId: addToWishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId: { type: string }
      responses:
        '204': { description: Agregado }
  /me/wishlist/{itemId}:
    delete:
      tags: [Tienda]
      summary: Quitar un objeto de la lista de deseos
      operationId: removeFromWishlist
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Quitado }
  /events:
    get:
      tags: [Eventos]
      summary: Eventos de la temporada (activos y próximos)
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Eventos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
  /news:
    get:
      tags: [Noticias]
      summary: Noticias oficiales publicadas hasta asOf, más recientes primero
      operationId: listNews
      parameters:
        - name: tag
          in: query
          schema: { $ref: '#/components/schemas/NewsTag' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Noticias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NewsSummary' }
  /news/{newsId}:
    get:
      tags: [Noticias]
      summary: Una noticia completa
      operationId: getNews
      parameters:
        - name: newsId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Noticia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsArticle' }
        '404': { $ref: '#/components/responses/NotFound' }
  /calendar:
    get:
      tags: [Temporada]
      summary: 'Lo que viene en la temporada desde asOf: eventos, rotación de tienda y retos, regalos, fin de temporada'
      operationId: listCalendar
      parameters:
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Entradas en orden de fecha
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CalendarEntry' }
  /sessions:
    get:
      tags: [Escuadras]
      summary: Sesiones de escuadra abiertas
      operationId: listSessions
      parameters:
        - name: mode
          in: query
          schema: { $ref: '#/components/schemas/Mode' }
        - name: language
          in: query
          schema: { type: string, examples: [es, en] }
        - name: micRequired
          in: query
          schema: { type: boolean }
        - name: difficulty
          in: query
          schema: { $ref: '#/components/schemas/HordeDifficulty' }
        - name: startsAfter
          in: query
          schema: { type: string, format: date-time }
        - name: startsBefore
          in: query
          description: Con startsAfter, permite pedir solo las sesiones de hoy
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Sesiones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SquadSession' }
    post:
      tags: [Escuadras]
      summary: Crear una sesión
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewSquadSession' }
      responses:
        '201':
          description: Sesión creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SquadSession' }
  /sessions/{sessionId}:
    get:
      tags: [Escuadras]
      summary: Detalle de una sesión (planificador de escuadras)
      operationId: getSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Sesión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SquadSession' }
  /sessions/{sessionId}/join:
    post:
      tags: [Escuadras]
      summary: Unirse a una sesión con un rol
      operationId: joinSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                squad: { type: integer, minimum: 1, maximum: 3 }
                role: { $ref: '#/components/schemas/HordeRole' }
      responses:
        '200':
          description: Sesión actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SquadSession' }
  /sessions/{sessionId}/deploy:
    post:
      tags: [Escuadras]
      summary: Desplegar (en la demo devuelve un deep link simulado al juego)
      operationId: deploySession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Enlace para abrir el juego
          content:
            application/json:
              schema:
                type: object
                required: [launchUrl]
                properties:
                  launchUrl: { type: string, examples: ['edaycompanion://launch?session=abc'] }
  /clans/{clanId}:
    get:
      tags: [Clanes]
      summary: Página del clan
      operationId: getClan
      parameters:
        - $ref: '#/components/parameters/ClanId'
      responses:
        '200':
          description: Clan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clan' }
  /clans/{clanId}/leaderboard:
    get:
      tags: [Clanes]
      summary: Clasificación interna del clan
      operationId: getClanLeaderboard
      parameters:
        - $ref: '#/components/parameters/ClanId'
      responses:
        '200':
          description: Clasificación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Leaderboard' }
  /guides:
    get:
      tags: [Guías]
      summary: Guías oficiales y de creadores, las más recientes primero
      operationId: listGuides
      parameters:
        - name: section
          in: query
          schema: { $ref: '#/components/schemas/GuideSection' }
        - name: role
          in: query
          description: Solo las guías de una clase de Horde Siege
          schema: { $ref: '#/components/schemas/HordeRole' }
      responses:
        '200':
          description: Guías
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GuideSummary' }
  /guides/{guideId}:
    get:
      tags: [Guías]
      summary: Una guía completa
      operationId: getGuide
      parameters:
        - name: guideId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Guía
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guide' }
        '404': { $ref: '#/components/responses/NotFound' }
  /creators:
    get:
      tags: [Comunidad]
      summary: Creadores de contenido destacados, primero los que transmiten en vivo
      operationId: listCreators
      parameters:
        - name: language
          in: query
          schema: { type: string, examples: [es] }
      responses:
        '200':
          description: Creadores
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Creator' }
  /promos:
    get:
      tags: [Colaboraciones]
      summary: Espacios patrocinados y colaboraciones para un lugar de la app
      operationId: listPromos
      parameters:
        - name: placement
          in: query
          required: true
          schema: { $ref: '#/components/schemas/PromoPlacement' }
      responses:
        '200':
          description: Espacios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Promo' }
  /me/achievements:
    get:
      tags: [Servicio]
      summary: Logros del jugador con su Gamerscore
      operationId: listMyAchievements
      parameters:
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Logros
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementList' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de la sesión simulada "Iniciar sesión con Xbox".
  parameters:
    AsOf:
      name: asOf
      in: query
      description: Fecha simulada (reloj de demo). Si falta, se usa la fecha actual.
      schema: { type: string, format: date-time }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    ClanId:
      name: clanId
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: No encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Petición inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Mode:
      type: string
      enum: [versus_tdm, versus_conquest, versus_ranked, horde_siege, campaign]
    HordeRole:
      type: string
      enum: [assault, breacher, marksman, medic]
    Platform:
      type: string
      enum: [xbox, pc]
    Rank:
      type: object
      required: [tier, division, points]
      properties:
        tier: { type: string, examples: [bronze, silver, gold, onyx] }
        division: { type: integer, minimum: 1, maximum: 3 }
        points: { type: integer }
    Player:
      type: object
      required: [id, gamertag, platform, country, timezone, level]
      properties:
        id: { type: string }
        gamertag: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        country: { type: string, description: ISO 3166-1 alfa-2 }
        timezone: { type: string, description: Zona IANA; la app muestra todas las horas en esta zona, examples: [America/Mexico_City] }
        level: { type: integer }
        rank:
          description: Null hasta jugar la primera partida de Ranked
          anyOf: [{ $ref: '#/components/schemas/Rank' }, { type: 'null' }]
        clanId: { type: [string, 'null'] }
        accessType: { type: string, enum: [purchase, game_pass, game_pass_premium_upgrade] }
    WeeklyReport:
      type: object
      required: [weekStart, hoursPlayed, matchesPlayed, challengesDone, challengesTotal, nextMission]
      properties:
        weekStart: { type: string, format: date }
        hoursPlayed: { type: number }
        matchesPlayed: { type: integer }
        challengesDone: { type: integer }
        challengesTotal: { type: integer }
        seasonProgress: { type: number, minimum: 0, maximum: 1 }
        daysSinceLastMatch: { type: [integer, 'null'], minimum: 0 }
        rival:
          type: object
          description: Rival de la semana, con rango cercano al del jugador
          properties:
            gamertag: { type: string }
            pointsAhead: { type: integer }
            rank: { type: [string, 'null'], examples: ['Plata 2'] }
        nextMission:
          type: object
          required: [title, estimatedMinutes, mode]
          properties:
            title: { type: string }
            estimatedMinutes: { type: integer }
            mode: { $ref: '#/components/schemas/Mode' }
            reward: { type: string }
            launchUrl: { type: string, description: Deep link simulado que abre el juego en el modo de la misión }
            reason: { type: string, description: 'Por qué se sugiere, en una línea', examples: ['Ranked abrió el 13 oct y aún no tienes rango'] }
            alternatives:
              type: array
              description: Otras opciones según cómo juega el jugador
              items:
                type: object
                required: [title, mode]
                properties:
                  title: { type: string }
                  mode: { $ref: '#/components/schemas/Mode' }
                  launchUrl: { type: string }
    Notification:
      type: object
      required: [id, kind, title, createdAt, read]
      properties:
        id: { type: string }
        kind: { type: string, enum: [mission, session, wishlist, event, rival] }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        link: { type: string, description: Ruta dentro de la app, por ejemplo /comunidad/escuadra/sess_friday }
    Wallet:
      type: object
      required: [coins, iron, coinsThisWeek, coinsWeeklyCap, capResetsAt]
      properties:
        coins: { type: integer, minimum: 0, description: Se ganan jugando }
        iron: { type: integer, minimum: 0, description: Moneda de pago; la app no la vende }
        coinsThisWeek: { type: integer, minimum: 0 }
        coinsWeeklyCap: { type: integer }
        capResetsAt: { type: string, format: date-time }
    NotificationPrefs:
      type: object
      description: Por defecto solo avisa de la escuadra y de la lista de deseos
      properties:
        squad: { type: boolean, default: true }
        wishlist: { type: boolean, default: true }
        events: { type: boolean, default: false }
        rival: { type: boolean, default: false }
        ranked: { type: boolean, default: false }
        quietHours:
          type: object
          properties:
            from: { type: string, examples: ['22:00'] }
            to: { type: string, examples: ['08:00'] }
    MedalTier:
      type: string
      enum: [bronze, silver, gold, onyx, diamond]
    MedalCategory:
      type: string
      enum: [weapon, grenade, kill_type, support, horde, enemy, versus, campaign, progression, event]
    Medal:
      type: object
      description: Una serie de medallas de cinco niveles, como en la personalización del juego
      required: [id, name, category, unit, progress, tiers, equipped]
      properties:
        id: { type: string }
        name: { type: string, examples: [Bajas con Lancer MK1] }
        category: { $ref: '#/components/schemas/MedalCategory' }
        unit: { type: string, description: 'Lo que se cuenta, para leer "Consigue 250 bajas con el Lancer MK1"' }
        progress: { type: integer, minimum: 0 }
        equipped: { type: boolean }
        tiers:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: object
            required: [tier, goal, reward, unlockedAt]
            properties:
              tier: { $ref: '#/components/schemas/MedalTier' }
              goal: { type: integer, minimum: 1 }
              reward:
                type: object
                required: [amount, currency]
                properties:
                  amount: { type: integer }
                  currency: { type: string, enum: [coins] }
                  unlock: { type: string, description: 'Lo que desbloquea además de las Monedas: un aspecto, un emblema o un título', examples: ['Título «Sierra en mano»'] }
              unlockedAt: { type: [string, 'null'], format: date-time }
    MedalUnlock:
      type: object
      required: [medalId, name, tier, unlockedAt]
      properties:
        medalId: { type: string }
        name: { type: string }
        tier: { $ref: '#/components/schemas/MedalTier' }
        unlockedAt: { type: string, format: date-time }
    ServiceRecord:
      type: object
      required: [gamertag, level, title, career, versus, horde, campaign, classes, medals, equipped, trivia, breakdown]
      properties:
        gamertag: { type: string }
        level: { type: integer }
        title: { type: string, description: Título de perfil }
        career:
          type: object
          required: [matches, hoursPlayed, daysPlayed, bestDayStreak, kills, deaths, kd, accuracy, share]
          properties:
            matches: { type: integer }
            hoursPlayed: { type: number }
            daysPlayed: { type: integer }
            bestDayStreak: { type: integer }
            daysSinceLastMatch: { type: [integer, 'null'] }
            firstMatchAt: { type: [string, 'null'], format: date-time }
            favoriteHour: { type: [string, 'null'], description: 'Hora local en que más juega, "21:00"' }
            favoriteWeekday: { type: [string, 'null'], description: Día de la semana en que más juega }
            kills: { type: integer }
            deaths: { type: integer }
            kd: { type: number }
            accuracy: { type: number, description: Promedio de 0 a 1 }
            share:
              type: object
              description: Parte del tiempo jugado por modo, de 0 a 1
              required: [versus, horde, campaign]
              properties:
                versus: { type: number }
                horde: { type: number }
                campaign: { type: number }
        versus:
          type: object
          required: [matches, wins, losses, draws, winRate, bestWinStreak, kills, deaths, kd, accuracy, hoursPlayed, byMode]
          properties:
            matches: { type: integer }
            wins: { type: integer }
            losses: { type: integer }
            draws: { type: integer }
            winRate: { type: number }
            bestWinStreak: { type: integer }
            kills: { type: integer }
            deaths: { type: integer }
            kd: { type: number }
            accuracy: { type: number }
            hoursPlayed: { type: number }
            bestKills: { type: [integer, 'null'], description: Más bajas en una partida }
            rank:
              oneOf:
                - $ref: '#/components/schemas/Rank'
                - type: 'null'
            byMode:
              type: array
              items:
                type: object
                required: [mode, matches, wins]
                properties:
                  mode: { $ref: '#/components/schemas/Mode' }
                  matches: { type: integer }
                  wins: { type: integer }
            bestMap:
              type: [object, 'null']
              required: [map, matches, wins]
              properties:
                map: { type: string }
                matches: { type: integer }
                wins: { type: integer }
        horde:
          type: object
          required: [matches, completed, bestWave, waveGoal, wavesCleared, kills, hoursPlayed, byMap]
          properties:
            matches: { type: integer }
            completed: { type: integer }
            bestWave: { type: integer }
            waveGoal: { type: integer }
            wavesCleared: { type: integer }
            kills: { type: integer }
            hoursPlayed: { type: number }
            mainRole:
              oneOf:
                - $ref: '#/components/schemas/HordeRole'
                - type: 'null'
            byMap:
              type: array
              items:
                type: object
                required: [map, matches, bestWave]
                properties:
                  map: { type: string }
                  matches: { type: integer }
                  bestWave: { type: integer }
        campaign:
          type: object
          required: [chaptersCompleted, chaptersTotal, attempts, hoursPlayed, kills]
          properties:
            chaptersCompleted: { type: integer }
            chaptersTotal: { type: integer }
            attempts: { type: integer }
            hoursPlayed: { type: number }
            kills: { type: integer }
        classes:
          type: array
          description: Nivel de cada clase de Horde Siege, la más jugada primero
          items: { $ref: '#/components/schemas/ClassLevel' }
        medals:
          type: object
          required: [earned, total, seriesCompleted, seriesTotal, latest]
          properties:
            earned: { type: integer, description: Niveles obtenidos en todas las series }
            total: { type: integer }
            seriesCompleted: { type: integer }
            seriesTotal: { type: integer }
            latest:
              type: array
              description: Los niveles más recientes, el último primero
              items: { $ref: '#/components/schemas/MedalUnlock' }
        equipped:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/MedalUnlock' }
        trivia:
          type: array
          description: Curiosidades al estilo GTA, ya redactadas para mostrarse
          items:
            type: object
            required: [id, label, value]
            properties:
              id: { type: string }
              label: { type: string, examples: [Balas disparadas] }
              value: { type: string, examples: ['48,210'] }
              detail: { type: string, examples: [Unas 160 cajas de munición] }
        breakdown:
          type: object
          description: Desgloses para dibujar gráficas. Las listas vienen ordenadas de mayor a menor, con lo menor ya agrupado en «Otras».
          required: [killsByMode, killsByWeapon, killsByType, killsByEnemy, versusByMap, activityByHour, activityByWeekday]
          properties:
            killsByMode:
              type: array
              description: Bajas por modo (Versus, Horde, Campaña); suman career.kills
              items: { $ref: '#/components/schemas/Slice' }
            killsByWeapon:
              type: array
              description: Bajas con armas y granadas en Versus y Horde, las 5 armas más usadas y «Otras armas y granadas»
              items: { $ref: '#/components/schemas/Slice' }
            killsByType:
              type: array
              description: Bajas especiales; se traslapan entre sí (un disparo a la cabeza puede ser con Longshot), no suman un total
              items: { $ref: '#/components/schemas/Slice' }
            killsByEnemy:
              type: array
              description: Bajas en Horde por tipo de enemigo, los 5 más comunes y «Otros»; suman horde.kills
              items: { $ref: '#/components/schemas/Slice' }
            versusByMap:
              type: array
              items:
                type: object
                required: [map, matches, wins]
                properties:
                  map: { type: string }
                  matches: { type: integer }
                  wins: { type: integer }
            activityByHour:
              type: array
              description: Partidas por hora local en que terminaron, de 0 a 23
              minItems: 24
              maxItems: 24
              items: { type: integer, minimum: 0 }
            activityByWeekday:
              type: array
              description: Partidas por día de la semana local, de lunes a domingo
              minItems: 7
              maxItems: 7
              items: { type: integer, minimum: 0 }
    Slice:
      type: object
      description: Una parte de un total, para gráficas
      required: [label, value]
      properties:
        label: { type: string, examples: [Lancer MK1] }
        value: { type: integer, minimum: 0 }
    MatchSummary:
      type: object
      required: [id, mode, map, endedAt, result]
      properties:
        id: { type: string }
        mode: { $ref: '#/components/schemas/Mode' }
        map: { type: string }
        endedAt: { type: string, format: date-time }
        result: { type: string, enum: [win, loss, draw, completed, failed] }
        kills: { type: integer }
        deaths: { type: integer }
        rankDelta: { type: [integer, 'null'] }
        durationSeconds: { type: integer }
        wavesCleared: { type: [integer, 'null'], description: Solo Horde Siege }
        waveGoal: { type: [integer, 'null'], description: Oleadas para completar el mapa; solo Horde Siege }
    MatchReport:
      allOf:
        - $ref: '#/components/schemas/MatchSummary'
        - type: object
          properties:
            accuracy: { type: number, minimum: 0, maximum: 1 }
            medals:
              type: array
              items: { type: string }
            takeaway:
              type: object
              description: Una lección concreta de la partida, con un enlace a lo que ayuda a aplicarla
              required: [text]
              properties:
                text: { type: string, examples: ['Sin Médico nadie te levantó. El viernes aún te falta uno.'] }
                link: { type: string, description: Ruta de la app, como /comunidad/escuadra/sess_friday }
            scoreboard:
              type: array
              items:
                type: object
                required: [gamertag, team, score]
                properties:
                  gamertag: { type: string }
                  team: { type: string }
                  score: { type: integer }
                  kills: { type: integer }
                  deaths: { type: integer }
                  role: { $ref: '#/components/schemas/HordeRole', description: Solo Horde Siege }
                  isMe: { type: boolean }
    Leaderboard:
      type: object
      required: [mode, scope, entries]
      properties:
        mode: { $ref: '#/components/schemas/Mode' }
        scope: { type: string }
        metric:
          type: string
          enum: [rank_points, best_wave]
          description: Ranked usa puntos de rango; Horde Siege usa la mejor oleada de la temporada
        entries:
          type: array
          items: { $ref: '#/components/schemas/LeaderboardEntry' }
        me: { $ref: '#/components/schemas/LeaderboardEntry' }
    LeaderboardEntry:
      type: object
      required: [position, gamertag, points]
      properties:
        position: { type: integer }
        gamertag: { type: string }
        points: { type: integer }
        country: { type: string }
        clanTag: { type: [string, 'null'] }
    Season:
      type: object
      required: [id, number, name, startsAt, endsAt]
      properties:
        id: { type: string }
        number: { type: integer }
        name: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    Challenge:
      type: object
      required: [id, title, progress, goal, expiresAt]
      properties:
        id: { type: string }
        title: { type: string }
        mode:
          description: Modo al que aplica; null si cuenta cualquier modo
          anyOf:
            - $ref: '#/components/schemas/Mode'
            - type: 'null'
        progress: { type: integer }
        goal: { type: integer }
        reward: { type: string }
        expiresAt: { type: string, format: date-time }
    StoreItem:
      type: object
      required: [id, name, type, price]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [character_skin, weapon_skin, banner, emblem, bundle] }
        price:
          type: object
          required: [amount, currency]
          properties:
            amount: { type: integer }
            currency: { type: string, enum: [iron, coins] }
        imageUrl: { type: string }
        wishlisted: { type: boolean }
    StoreRotation:
      type: object
      required: [startsAt, endsAt, items]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: Siguiente martes }
        items:
          type: array
          items: { $ref: '#/components/schemas/StoreItem' }
    Event:
      type: object
      required: [id, name, startsAt, endsAt]
      properties:
        id: { type: string }
        name: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        modes:
          type: array
          items: { $ref: '#/components/schemas/Mode' }
        rewards:
          type: array
          items: { type: string }
    NewsTag:
      type: string
      enum: [patch, event, season, store, community]
    NewsSummary:
      type: object
      required: [id, tag, title, summary, publishedAt, readMinutes]
      properties:
        id: { type: string }
        tag: { $ref: '#/components/schemas/NewsTag' }
        title: { type: string }
        summary: { type: string }
        publishedAt: { type: string, format: date-time }
        readMinutes: { type: integer, minimum: 1 }
        featured: { type: boolean, description: Candidata a noticia destacada en Inicio }
    NewsArticle:
      allOf:
        - $ref: '#/components/schemas/NewsSummary'
        - type: object
          required: [sections]
          properties:
            sections:
              type: array
              items:
                type: object
                properties:
                  heading: { type: string }
                  paragraphs: { type: array, items: { type: string } }
                  bullets: { type: array, items: { type: string } }
            knownIssues:
              type: array
              description: Solo notas de parche
              items: { type: string }
            cta:
              type: object
              required: [label, link]
              properties:
                label: { type: string }
                link: { type: string, description: Ruta dentro de la app }
    CalendarEntry:
      type: object
      required: [id, kind, title, at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [event, store, gift, season] }
        title: { type: string }
        at: { type: string, format: date-time }
        link: { type: string }
    NewSquadSession:
      type: object
      required: [mode, startsAt, slots]
      properties:
        mode: { $ref: '#/components/schemas/Mode' }
        startsAt: { type: string, format: date-time }
        slots: { type: integer, minimum: 2, maximum: 12 }
        language: { type: string }
        micRequired: { type: boolean, default: false }
        difficulty: { $ref: '#/components/schemas/HordeDifficulty' }
        map: { type: string }
        clanId: { type: [string, 'null'] }
    HordeDifficulty:
      type: string
      enum: [casual, normal, hard, insane]
    SquadSession:
      allOf:
        - $ref: '#/components/schemas/NewSquadSession'
        - type: object
          required: [id, hostGamertag, members, status]
          properties:
            id: { type: string }
            hostGamertag: { type: string }
            status: { type: string, enum: [open, full, in_progress, finished] }
            shareUrl: { type: string }
            members:
              type: array
              items:
                type: object
                required: [gamertag]
                properties:
                  gamertag: { type: string }
                  squad: { type: integer, minimum: 1, maximum: 3 }
                  role: { $ref: '#/components/schemas/HordeRole' }
                  confirmed: { type: boolean, description: El organizador ya ve su lugar y su rol }
    Clan:
      type: object
      required: [id, name, tag, memberCount]
      properties:
        id: { type: string }
        name: { type: string }
        tag: { type: string }
        memberCount: { type: integer }
        language: { type: string }
        upcomingSessions:
          type: array
          items: { $ref: '#/components/schemas/SquadSession' }
    ClassLevel:
      type: object
      required: [role, level, maxLevel, xp, levelXp, nextLevelXp, matches]
      properties:
        role: { $ref: '#/components/schemas/HordeRole' }
        level: { type: integer, minimum: 1 }
        maxLevel: { type: integer }
        xp: { type: integer, description: Experiencia total de la clase }
        levelXp: { type: integer, description: Experiencia donde empieza el nivel actual }
        nextLevelXp: { type: [integer, 'null'], description: 'Experiencia del siguiente nivel; null en el nivel máximo' }
        matches: { type: integer, description: Partidas de Horde Siege con esta clase }
    Achievement:
      type: object
      required: [id, name, description, gamerscore, goal, progress, rarity, unlockedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        gamerscore: { type: integer }
        goal: { type: integer }
        progress: { type: integer }
        rarity: { type: number, description: Parte de los jugadores que lo tiene, de 0 a 1 }
        unlockedAt: { type: [string, 'null'], format: date-time }
    AchievementList:
      type: object
      required: [gamerscore, gamerscoreTotal, unlocked, items]
      properties:
        gamerscore: { type: integer }
        gamerscoreTotal: { type: integer }
        unlocked: { type: integer }
        items:
          type: array
          description: Los obtenidos primero, el más reciente arriba; luego los que faltan, el más avanzado arriba
          items: { $ref: '#/components/schemas/Achievement' }
    GuideSection:
      type: string
      enum: [classes, weapons, maps, collectibles, builds]
    GuideSummary:
      type: object
      required: [id, section, title, summary, author, readMinutes, updatedAt]
      properties:
        id: { type: string }
        section: { $ref: '#/components/schemas/GuideSection' }
        title: { type: string }
        summary: { type: string }
        author:
          type: object
          required: [name, kind]
          properties:
            name: { type: string }
            kind: { type: string, enum: [official, creator] }
            creatorId: { type: string }
        readMinutes: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
        role: { $ref: '#/components/schemas/HordeRole' }
        map: { type: string }
        patch: { type: string, description: 'Parche con el que se revisó, "2 nov"' }
    Guide:
      allOf:
        - $ref: '#/components/schemas/GuideSummary'
        - type: object
          required: [facts, sections]
          properties:
            facts:
              type: array
              description: Datos clave para leer de un vistazo
              items:
                type: object
                required: [label, value]
                properties:
                  label: { type: string }
                  value: { type: string }
            sections:
              type: array
              items:
                type: object
                properties:
                  heading: { type: string }
                  paragraphs: { type: array, items: { type: string } }
                  bullets: { type: array, items: { type: string } }
            cta:
              type: object
              required: [label, link]
              properties:
                label: { type: string }
                link: { type: string }
    Creator:
      type: object
      required: [id, name, platform, language, followers, focus, live, latest]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string, enum: [youtube, twitch] }
        language: { type: string }
        followers: { type: integer }
        focus: { type: string }
        live: { type: boolean }
        latest:
          type: object
          required: [title, publishedAt]
          properties:
            title: { type: string }
            minutes: { type: integer, description: 0 si es una transmisión en vivo }
            publishedAt: { type: string, format: date-time }
        guides: { type: integer, description: Guías suyas en la app }
    PromoPlacement:
      type: string
      enum: [home, news, guides, community]
    Promo:
      type: object
      description: Espacio patrocinado o colaboración. En la demo las marcas son inventadas y nada se vende.
      required: [id, placement, kind, partner, title, body, cta]
      properties:
        id: { type: string }
        placement: { $ref: '#/components/schemas/PromoPlacement' }
        kind: { type: string, enum: [sponsored, collab], description: '"Patrocinado" o "Colaboración"' }
        partner: { type: string }
        title: { type: string }
        body: { type: string }
        cta:
          type: object
          required: [label]
          properties:
            label: { type: string }
            link: { type: string, description: Ruta dentro de la app; sin link sería una página del socio }
        glow: { type: string, description: Color del arte de la tarjeta }
